<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#233C3F" flood-opacity="0.12"/>
    </filter>

    <symbol id="mark-main" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.107 50.116a18.292 18.292 0 0 0 0 36.582h2.47V72.716a4.309 4.309 0 0 1 0-8.618V50.116Z" transform="translate(-272.027 -49.103)"/>
        <path d="M282.627 97.034a10.16 10.16 0 0 0-10.146 10.029h20.293a10.16 10.16 0 0 0-10.147-10.029Z" transform="translate(-272.205 -69.409)"/>
      </g>
    </symbol>
    <symbol id="mark-fold" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.3 109.044h1.211a18.286 18.286 0 0 1-14.479-7.4 10.232 10.232 0 0 0-1.81 2.169 27.689 27.689 0 0 0 15.078 5.231Z" transform="translate(-273.396 -71.409)"/>
      </g>
    </symbol>
    <clipPath id="mother-silhouette" clipPathUnits="userSpaceOnUse">
      <g transform="translate(25.4 5) scale(2.39)">
        <path d="M290.107 50.116a18.292 18.292 0 0 0 0 36.582h2.47V72.716a4.309 4.309 0 0 1 0-8.618V50.116Z" transform="translate(-272.027 -49.103)"/>
        <path d="M282.627 97.034a10.16 10.16 0 0 0-10.146 10.029h20.293a10.16 10.16 0 0 0-10.147-10.029Z" transform="translate(-272.205 -69.409)"/>
      </g>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="#EAF1F0"/>

  <!-- 01 · Core: the inherited opening focuses on one agent nucleus. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="80" y="62" width="260" height="260" viewBox="0 0 100 100">
      <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
      <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      <circle cx="86" cy="50" r="5.5" fill="#54B4AF"/>
    </svg>
  </g>
  <circle cx="80" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="80" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">1</text>

  <!-- 02 · Stack: two inherited marks represent parallel agents/layers. -->
  <g filter="url(#card-shadow)">
    <rect x="430" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="470" y="62" width="260" height="260" viewBox="0 0 100 100">
      <g transform="translate(10 4) scale(.92)">
        <use href="#mark-main" width="100" height="100" color="#48707A"/>
      </g>
      <g transform="translate(-7 0)">
        <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
        <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      </g>
    </svg>
  </g>
  <circle cx="470" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="470" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">2</text>

  <!-- 03 · Dual ports: one opening becomes two task channels. -->
  <g filter="url(#card-shadow)">
    <rect x="820" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="860" y="62" width="260" height="260" viewBox="0 0 100 100">
      <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
      <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      <circle cx="74.5" cy="50" r="11" fill="#4BB6B0"/>
      <rect x="74.5" y="28" width="25.5" height="44" fill="#090D14"/>
      <circle cx="74.5" cy="42" r="6.8" fill="#090D14"/>
      <circle cx="74.5" cy="58" r="6.8" fill="#090D14"/>
    </svg>
  </g>
  <circle cx="860" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="860" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">3</text>

  <!-- 04 · Digital port: the round opening becomes one soft square module. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="80" y="452" width="260" height="260" viewBox="0 0 100 100">
      <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
      <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      <circle cx="74.5" cy="50" r="11" fill="#4BB6B0"/>
      <rect x="74.5" y="28" width="25.5" height="44" fill="#090D14"/>
      <rect x="63" y="39" width="23" height="22" rx="7" fill="#090D14"/>
    </svg>
  </g>
  <circle cx="80" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="80" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">4</text>

  <!-- 05 · Strong fold: one larger inherited plane gives the product its own rhythm. -->
  <g filter="url(#card-shadow)">
    <rect x="430" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="470" y="452" width="260" height="260" viewBox="0 0 100 100">
      <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
      <path d="M22 68C35 81 51 88 77 89V104H20Z" fill="#48707A" clip-path="url(#mother-silhouette)"/>
    </svg>
  </g>
  <circle cx="470" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="470" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">5</text>

  <!-- 06 · Branch: the lower lobe splits into two parallel execution paths. -->
  <g filter="url(#card-shadow)">
    <rect x="820" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="860" y="452" width="260" height="260" viewBox="0 0 100 100">
      <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
      <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      <rect x="47.5" y="80" width="5" height="20" rx="2.5" fill="#090D14"/>
    </svg>
  </g>
  <circle cx="860" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="860" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">6</text>
</svg>
