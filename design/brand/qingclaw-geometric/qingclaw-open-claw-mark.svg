<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fold" x1="23" y1="91" x2="59" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54B4AF"/>
      <stop offset="1" stop-color="#48707A"/>
    </linearGradient>
    <mask id="open-claw" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#000"/>

      <!-- Exact Qinglion mother-mark masses, normalized into the square. -->
      <g transform="translate(8 5) scale(2.39)" fill="#fff">
        <path d="M290.107 50.116a18.292 18.292 0 0 0 0 36.582h2.47V72.716a4.309 4.309 0 0 1 0-8.618V50.116Z" transform="translate(-272.027 -49.103)"/>
        <path d="M282.627 97.034a10.16 10.16 0 0 0-10.146 10.029h20.293a10.16 10.16 0 0 0-10.147-10.029Z" transform="translate(-272.205 -69.409)"/>
      </g>

      <!-- One rounded extension turns the inherited opening into two claw lobes. -->
      <rect x="47" y="23" width="45" height="54" rx="21" fill="#fff"/>

      <!-- The original circular root continues into a wide, round-ended opening. -->
      <circle cx="58" cy="50" r="12" fill="#000"/>
      <rect x="58" y="43" width="42" height="14" rx="7" fill="#000"/>
    </mask>
  </defs>

  <rect width="100" height="100" fill="#4BB6B0" mask="url(#open-claw)"/>

  <!-- The mother brand's lower folded plane remains the only tonal accent. -->
  <g transform="translate(8 5) scale(2.39)">
    <path d="M290.3 109.044h1.211a18.286 18.286 0 0 1-14.479-7.4 10.232 10.232 0 0 0-1.81 2.169 27.689 27.689 0 0 0 15.078 5.231Z" transform="translate(-273.396 -71.409)" fill="url(#fold)"/>
  </g>
</svg>
