<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#233C3F" flood-opacity="0.12"/>
    </filter>

    <!-- Exact Qinglion master-mark geometry, normalized to 100 × 100. -->
    <symbol id="mark-main" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.107 50.116a18.292 18.292 0 0 0 0 36.582h2.47V72.716a4.309 4.309 0 0 1 0-8.618V50.116Z" transform="translate(-272.027 -49.103)"/>
        <path d="M282.627 97.034a10.16 10.16 0 0 0-10.146 10.029h20.293a10.16 10.16 0 0 0-10.147-10.029Z" transform="translate(-272.205 -69.409)"/>
      </g>
    </symbol>
    <symbol id="mark-fold" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.3 109.044h1.211a18.286 18.286 0 0 1-14.479-7.4 10.232 10.232 0 0 0-1.81 2.169 27.689 27.689 0 0 0 15.078 5.231Z" transform="translate(-273.396 -71.409)"/>
      </g>
    </symbol>

    <clipPath id="card-2"><rect x="430" y="30" width="340" height="340" rx="64"/></clipPath>
  </defs>

  <rect width="1200" height="800" fill="#EAF1F0"/>

  <!-- 01 · Original colors on the current dark product surface. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <use href="#mark-main" x="80" y="62" width="260" height="260" color="#4BB6B0"/>
    <use href="#mark-fold" x="80" y="62" width="260" height="260" color="#48707A"/>
  </g>
  <circle cx="80" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="80" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">1</text>

  <!-- 02 · Large inherited mark, deliberately cropped like the source logo. -->
  <g filter="url(#card-shadow)" clip-path="url(#card-2)">
    <rect x="430" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <use href="#mark-main" x="325" y="-60" width="520" height="520" color="#4BB6B0"/>
    <use href="#mark-fold" x="325" y="-60" width="520" height="520" color="#48707A"/>
  </g>
  <circle cx="470" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="470" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">2</text>

  <!-- 03 · Deep-teal product tile with a reversed white mark. -->
  <g filter="url(#card-shadow)">
    <rect x="820" y="30" width="340" height="340" rx="64" fill="#48707A"/>
    <use href="#mark-main" x="860" y="62" width="260" height="260" color="#FFFFFF"/>
    <use href="#mark-fold" x="860" y="62" width="260" height="260" color="#54B4AF"/>
  </g>
  <circle cx="860" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="860" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">3</text>

  <!-- 04 · Quiet light product surface with the original brand colors. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="420" width="340" height="340" rx="64" fill="#F7FAF9"/>
    <use href="#mark-main" x="80" y="452" width="260" height="260" color="#4BB6B0"/>
    <use href="#mark-fold" x="80" y="452" width="260" height="260" color="#48707A"/>
  </g>
  <circle cx="80" cy="720" r="20" fill="#48707A"/>
  <text x="80" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>

  <!-- 05 · Brand-color tile with a dark single-color product stamp. -->
  <g filter="url(#card-shadow)">
    <rect x="430" y="420" width="340" height="340" rx="64" fill="#4BB6B0"/>
    <use href="#mark-main" x="470" y="452" width="260" height="260" color="#090D14"/>
    <use href="#mark-fold" x="470" y="452" width="260" height="260" color="#48707A"/>
  </g>
  <circle cx="470" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="470" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">5</text>

  <!-- 06 · Circular brand seal while keeping the mother mark untouched. -->
  <g filter="url(#card-shadow)">
    <rect x="820" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <circle cx="990" cy="590" r="126" fill="#4BB6B0"/>
    <use href="#mark-main" x="870" y="470" width="240" height="240" color="#090D14"/>
    <use href="#mark-fold" x="870" y="470" width="240" height="240" color="#48707A"/>
  </g>
  <circle cx="860" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="860" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#48707A">6</text>
</svg>
