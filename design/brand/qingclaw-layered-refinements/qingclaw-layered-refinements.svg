<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#233C3F" flood-opacity="0.12"/>
    </filter>
    <symbol id="mark-main" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.107 50.116a18.292 18.292 0 0 0 0 36.582h2.47V72.716a4.309 4.309 0 0 1 0-8.618V50.116Z" transform="translate(-272.027 -49.103)"/>
        <path d="M282.627 97.034a10.16 10.16 0 0 0-10.146 10.029h20.293a10.16 10.16 0 0 0-10.147-10.029Z" transform="translate(-272.205 -69.409)"/>
      </g>
    </symbol>
    <symbol id="mark-fold" viewBox="0 0 100 100">
      <g transform="translate(25.4 5) scale(2.39)" fill="currentColor">
        <path d="M290.3 109.044h1.211a18.286 18.286 0 0 1-14.479-7.4 10.232 10.232 0 0 0-1.81 2.169 27.689 27.689 0 0 0 15.078 5.231Z" transform="translate(-273.396 -71.409)"/>
      </g>
    </symbol>
  </defs>

  <rect width="800" height="800" fill="#EAF1F0"/>

  <!-- A · Same scale, pure horizontal offset. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="80" y="62" width="260" height="260" viewBox="0 0 100 100">
      <g transform="translate(10 0)">
        <use href="#mark-main" width="100" height="100" color="#48707A"/>
      </g>
      <g transform="translate(-6 0)">
        <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
        <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      </g>
    </svg>
  </g>
  <circle cx="80" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="80" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#48707A">A</text>

  <!-- B · Down-right offset, like two aligned product layers. -->
  <g filter="url(#card-shadow)">
    <rect x="420" y="30" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="460" y="62" width="260" height="260" viewBox="0 0 100 100">
      <g transform="translate(10 6) scale(.94)">
        <use href="#mark-main" width="100" height="100" color="#48707A"/>
      </g>
      <g transform="translate(-5 -1)">
        <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
        <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      </g>
    </svg>
  </g>
  <circle cx="460" cy="330" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="460" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#48707A">B</text>

  <!-- C · Smaller secondary agent, visibly independent but still inherited. -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="80" y="452" width="260" height="260" viewBox="0 0 100 100">
      <g transform="translate(18 7) scale(.84)">
        <use href="#mark-main" width="100" height="100" color="#48707A"/>
      </g>
      <g transform="translate(-5 0)">
        <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
        <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      </g>
    </svg>
  </g>
  <circle cx="80" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="80" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#48707A">C</text>

  <!-- D · Nested echo: the second inherited mark becomes an inner agent layer. -->
  <g filter="url(#card-shadow)">
    <rect x="420" y="420" width="340" height="340" rx="64" fill="#090D14"/>
    <svg x="460" y="452" width="260" height="260" viewBox="0 0 100 100">
      <g transform="translate(-5 0)">
        <use href="#mark-main" width="100" height="100" color="#4BB6B0"/>
        <use href="#mark-fold" width="100" height="100" color="#48707A"/>
      </g>
      <g transform="translate(16 16) scale(.68)">
        <use href="#mark-main" width="100" height="100" color="#48707A"/>
      </g>
    </svg>
  </g>
  <circle cx="460" cy="720" r="20" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="460" y="727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#48707A">D</text>
</svg>
